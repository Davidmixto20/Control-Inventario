<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Operario - Registro de Consumo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">Inventario Pro (Operario)</a>
      <div class="d-flex align-items-center gap-3">
        <span class="text-light small fw-bold" id="welcome-text"></span>
        <button class="btn btn-outline-light btn-sm fw-bold" data-bs-toggle="modal" data-bs-target="#passwordModal">Cambiar Clave</button>
        <button class="btn btn-outline-danger btn-sm fw-bold" id="logout-btn">Cerrar Sesión</button>
      </div>
    </div>
  </nav>

  <div class="container animate-fade-in" style="max-width: 900px;">
    
    <!-- Panel de Stock Actual -->
    <div class="glass-card p-4 mb-4">
      <h5 class="fw-bold text-dark mb-3">Inventario Disponible</h5>
      <div class="table-responsive table-custom">
        <table class="table mb-0 table-sm">
          <thead>
            <tr>
              <th>Material</th>
              <th>Stock</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="worker-inventory-table">
            <tr><td colspan="3" class="text-center py-3">Cargando inventario...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Formulario de Consumo -->
    <div class="glass-card p-3 p-md-5 mb-5">
      <h3 class="fw-bold text-center mb-4 text-dark">Registro de Producción</h3>
      
      <form id="consumption-form">
        <div class="row mb-4">
          <div class="col-md-6">
            <label class="form-label fw-bold">Número de Batch</label>
            <input type="text" class="form-control" id="batch-number" placeholder="Ingrese el numero de lote" required>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold">Rendimiento (Unidades Producidas)</label>
            <input type="number" class="form-control" id="total-yield" step="0.01" required>
          </div>
        </div>

        <hr class="mb-4">

        <h5 class="fw-bold mb-3">Materiales Consumidos</h5>
        
        <div id="materials-container">
          <!-- Las filas de materiales se inyectan aquí -->
        </div>

        <div class="d-flex justify-content-center align-items-center mt-4 mb-4">
          <button type="button" class="btn btn-outline-secondary fw-bold" id="add-material-btn">
            + Añadir Otro Material
          </button>
        </div>

        <button type="submit" class="btn btn-primary-custom w-100 py-3 fs-5 fw-bold" id="submit-btn">
          Registrar Consumo y Actualizar Inventario
        </button>
      </form>
    </div>
  </div>

  <!-- Modal Cambiar Contraseña -->
  <div class="modal fade" id="passwordModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content glass-card border-0">
        <div class="modal-header border-bottom-0">
          <h5 class="modal-title fw-bold">Cambiar Contraseña</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="password-form">
            <div class="mb-4">
              <label class="form-label fw-bold">Nueva Contraseña</label>
              <input type="password" class="form-control" id="new-password" minlength="6" required>
            </div>
            <button type="submit" class="btn btn-primary-custom w-100 fw-bold py-2 fs-6">Actualizar Contraseña</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/worker.js"></script>
</body>
</html>
