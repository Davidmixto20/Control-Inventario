<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Control de Inventario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="container animate-fade-in" style="max-width: 400px; width: 100%;">
    <div class="glass-card p-5 text-center">
      <h3 class="fw-bold mb-4">Inventario Pro</h3>
      
      <form id="login-form">
        <div class="mb-3 text-start">
          <label class="form-label text-muted small fw-bold">Usuario</label>
          <input type="text" class="form-control py-2" id="username" required>
        </div>
        <div class="mb-4 text-start">
          <label class="form-label text-muted small fw-bold">Contraseña</label>
          <input type="password" class="form-control py-2" id="password" required>
        </div>
        <button type="submit" class="btn btn-primary-custom w-100 py-2 fs-5 fw-bold" id="login-btn">
          Iniciar Sesión
        </button>
      </form>
      <div id="login-error" class="text-danger mt-3 small fw-bold d-none"></div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('login-error');
      const btn = document.getElementById('login-btn');

      btn.disabled = true;
      btn.textContent = 'Verificando...';
      errorDiv.classList.add('d-none');

      try {
        const response = await fetch(`${API_URL}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await response.json();

        if (response.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('role', data.role);
          localStorage.setItem('username', data.username);
          
          if (data.role === 'ADMIN') {
            window.location.href = 'index.html';
          } else {
            window.location.href = 'worker.html';
          }
        } else {
          errorDiv.textContent = data.error;
          errorDiv.classList.remove('d-none');
        }
      } catch (err) {
        errorDiv.textContent = 'Error de red. ¿Está el servidor Node encendido?';
        errorDiv.classList.remove('d-none');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Iniciar Sesión';
      }
    });
  </script>
</body>
</html>
